name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontends/pocket-android/**'
      - 'frontends/pocket-android-jni/**'
      - 'crates/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'frontends/pocket-android/**'
      - 'frontends/pocket-android-jni/**'
      - 'crates/**'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build native libs (arm64-v8a, armeabi-v7a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o frontends/pocket-android/app/src/main/jniLibs \
            build --release -p pocket-android-jni

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        working-directory: frontends/pocket-android
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x frontends/pocket-android/gradlew

      - name: Build APK
        working-directory: frontends/pocket-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketHLE-apk
          path: frontends/pocket-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
